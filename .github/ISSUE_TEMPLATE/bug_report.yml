name: Bug report
description: Report a problem in the Bindlume testing preview
title: "[Bug]: "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Bindlume revision, Omarchy/Hyprland versions, display scale, and desktop language.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove private conversations, credentials, and personal information before posting.
